services:
  db:
    image: postgis/postgis:15-3.4
    container_name: postgres_db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "${DB_HOST_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 6s
      retries: 5
      start_period: 10s
  mongo-primary:
    image: mongo:7.0
    container_name: mongo_primary
    command:
      - mongod
      - --replSet
      - ${MONGO_REPLICA_SET}
      - --bind_ip_all
      - --port
      - "27017"
    ports:
      - "${MONGO_PRIMARY_HOST_PORT}:27017"
    volumes:
      - mongo_primary_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--host", "localhost:27017", "--quiet", "--eval", "quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s
    stop_grace_period: 30s
  mongo-secondary:
    image: mongo:7.0
    container_name: mongo_secondary
    command:
      - mongod
      - --replSet
      - ${MONGO_REPLICA_SET}
      - --bind_ip_all
      - --port
      - "27017"
    ports:
      - "${MONGO_SECONDARY_HOST_PORT}:27017"
    volumes:
      - mongo_secondary_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--host", "localhost:27017", "--quiet", "--eval", "quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s
    stop_grace_period: 30s
  mongo-init:
    image: mongo:7.0
    container_name: mongo_replica_init
    environment:
      - MONGO_REPLICA_SET=${MONGO_REPLICA_SET}
    depends_on:
      mongo-primary:
        condition: service_healthy
      mongo-secondary:
        condition: service_healthy
    volumes:
      - ./database/mongo/0_init_replica_set.js:/scripts/0_init_replica_set.js:ro
    entrypoint:
      - mongosh
      - --host
      - mongo-primary:27017
      - --quiet
      - /scripts/0_init_replica_set.js
    restart: "no"
  backend:
    build:
      context: ./backend
      dockerfile: dockerfile
    container_name: backend_tbd
    ports:
      - "${BACKEND_HOST_PORT}:${BACKEND_CONTAINER_PORT}"
    environment:
      - SERVER_PORT=${BACKEND_CONTAINER_PORT}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - "MONGO_URI=mongodb://mongo-primary:27017,mongo-secondary:27017/?replicaSet=${MONGO_REPLICA_SET}&serverSelectionTimeoutMS=5000"
      - MONGO_DATABASE=${MONGO_DATABASE}
    depends_on:
      db:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile
    container_name: frontend_tbd
    environment:
      - REACT_APP_API_URL=${REACT_APP_API_URL}
    ports:
      - "${FRONTEND_HOST_PORT}:3000"
    depends_on:
      - backend
volumes:
  pgdata:
  mongo_primary_data:
  mongo_secondary_data:
