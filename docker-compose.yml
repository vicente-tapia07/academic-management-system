services:
  mongo-primary:
    image: mongo:7.0
    container_name: mongo_primary
    command:
      - mongod
      - --replSet
      - ${MONGO_REPLICA_SET}
      - --bind_ip_all
      - --port
      - "27017"
    ports:
      - "${MONGO_PRIMARY_HOST_PORT}:27017"
    volumes:
      - mongo_primary_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--host", "localhost:27017", "--quiet", "--eval", "quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s
    stop_grace_period: 30s
  mongo-secondary:
    image: mongo:7.0
    container_name: mongo_secondary
    command:
      - mongod
      - --replSet
      - ${MONGO_REPLICA_SET}
      - --bind_ip_all
      - --port
      - "27017"
    ports:
      - "${MONGO_SECONDARY_HOST_PORT}:27017"
    volumes:
      - mongo_secondary_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--host", "localhost:27017", "--quiet", "--eval", "quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s
    stop_grace_period: 30s
  mongo-init:
    image: mongo:7.0
    container_name: mongo_replica_init
    environment:
      - MONGO_REPLICA_SET=${MONGO_REPLICA_SET}
    depends_on:
      mongo-primary:
        condition: service_healthy
      mongo-secondary:
        condition: service_healthy
    volumes:
      - ./database/mongo/0_init_replica_set.js:/scripts/0_init_replica_set.js:ro
    entrypoint:
      - mongosh
      - --host
      - mongo-primary:27017
      - --quiet
      - /scripts/0_init_replica_set.js
    restart: "no"
  mongo-schema:
    image: mongo:7.0
    container_name: mongo_schema_init
    environment:
      - MONGO_DATABASE=${MONGO_DATABASE}
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    volumes:
      - ./database/mongo/1_collections_and_schema.js:/scripts/1_collections_and_schema.js:ro
    entrypoint:
      - mongosh
      - "mongodb://mongo-primary:27017,mongo-secondary:27017/?replicaSet=${MONGO_REPLICA_SET}"
      - --quiet
      - /scripts/1_collections_and_schema.js
    restart: "no"
  mongo-seed-users:
    image: mongo:7.0
    container_name: mongo_users_seed
    environment:
      - MONGO_DATABASE=${MONGO_DATABASE}
    depends_on:
      mongo-schema:
        condition: service_completed_successfully
    volumes:
      - ./database/mongo/1_5_seed_users.js:/scripts/1_5_seed_users.js:ro
    entrypoint:
      - mongosh
      - "mongodb://mongo-primary:27017,mongo-secondary:27017/?replicaSet=${MONGO_REPLICA_SET}"
      - --quiet
      - /scripts/1_5_seed_users.js
    restart: "no"
  mongo-indexes:
    image: mongo:7.0
    container_name: mongo_indexes_init
    environment:
      - MONGO_DATABASE=${MONGO_DATABASE}
    depends_on:
      mongo-schema:
        condition: service_completed_successfully
    volumes:
      - ./database/mongo/2_indexes.js:/scripts/2_indexes.js:ro
    entrypoint:
      - mongosh
      - "mongodb://mongo-primary:27017,mongo-secondary:27017/?replicaSet=${MONGO_REPLICA_SET}"
      - --quiet
      - /scripts/2_indexes.js
    restart: "no"
  mongo-seed:
    image: mongo:7.0
    container_name: mongo_domain_seed
    environment:
      - MONGO_DATABASE=${MONGO_DATABASE}
    depends_on:
      mongo-indexes:
        condition: service_completed_successfully
      mongo-seed-users:
        condition: service_completed_successfully
    volumes:
      - ./database/mongo/3_seed_mongo.js:/scripts/3_seed_mongo.js:ro
    entrypoint:
      - mongosh
      - "mongodb://mongo-primary:27017,mongo-secondary:27017/?replicaSet=${MONGO_REPLICA_SET}"
      - --quiet
      - /scripts/3_seed_mongo.js
    restart: "no"
  backend:
    build:
      context: ./backend
      dockerfile: dockerfile
    container_name: backend_tbd
    ports:
      - "${BACKEND_HOST_PORT}:${BACKEND_CONTAINER_PORT}"
    environment:
      - SERVER_PORT=${BACKEND_CONTAINER_PORT}
      - "MONGO_URI=mongodb://mongo-primary:27017,mongo-secondary:27017/?replicaSet=${MONGO_REPLICA_SET}&serverSelectionTimeoutMS=5000"
      - MONGO_DATABASE=${MONGO_DATABASE}
    depends_on:
      mongo-seed:
        condition: service_completed_successfully
      mongo-indexes:
        condition: service_completed_successfully
  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile
    container_name: frontend_tbd
    environment:
      - REACT_APP_API_URL=${REACT_APP_API_URL}
    ports:
      - "${FRONTEND_HOST_PORT}:3000"
    depends_on:
      - backend
volumes:
  mongo_primary_data:
  mongo_secondary_data:
